<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="pinkNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#00f5d4" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Outer Gauge Ring Arc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1f293d" stroke-width="24" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanPurple)" stroke-width="24" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="250" filter="url(#glow)"/>

  <!-- Speedometer & Telemetry Pulse Wave -->
  <path d="M 120 280 L 190 280 L 220 180 L 260 340 L 300 240 L 330 280 L 392 280" fill="none" stroke="#00f5d4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Core Equilibrium Nodes -->
  <circle cx="256" cy="256" r="48" fill="#0d1322" stroke="url(#pinkNeon)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="18" fill="#00f5d4"/>

  <!-- Orbital Status Indicators -->
  <circle cx="256" cy="76" r="14" fill="#00f5d4" filter="url(#glow)"/>
  <circle cx="436" cy="256" r="14" fill="#ff007f" filter="url(#glow)"/>
  <circle cx="256" cy="436" r="14" fill="#7928ca" filter="url(#glow)"/>
  <circle cx="76" cy="256" r="14" fill="#00f5d4" filter="url(#glow)"/>
</svg>
