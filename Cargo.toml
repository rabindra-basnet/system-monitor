[package]
name = "stasis"
version = "0.2.0"
edition = "2021"
authors = ["Rabindra Basnet"]
description = "A lightweight Stacer-like Linux System Monitor and Optimizer TUI written in Rust"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
sysinfo = "0.33"
libc = "0.2"
walkdir = "2.5"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
